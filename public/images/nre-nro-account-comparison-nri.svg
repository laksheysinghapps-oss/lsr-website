  <text x="62" y="280" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#546070">Indian income tax</text>
  <text x="352" y="261" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#C6A667" font-weight="700">Tax-free in India</text>
  <text x="352" y="280" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#8a9aaa">Interest fully exempt</text>
  <text x="642" y="261" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#ef4444" font-weight="600">Taxable in India</text>
  <text x="642" y="280" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#546070">TDS deducted at source</text>

  <!-- Row 4: NRI home loan -->
  <rect x="50" y="292" width="900" height="52" fill="#0d0d0d"/>
  <line x1="50" y1="292" x2="950" y2="292" stroke="#161616" stroke-width="1"/>
  <text x="62" y="313" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#9ca3af" letter-spacing="1" font-weight="600">EMI PAYMENT</text>
  <text x="62" y="332" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#546070">Home loan servicing</text>
  <text x="352" y="313" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#e5e7eb" font-weight="600">Allowed</text>
  <text x="352" y="332" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#8a9aaa">EMIs payable from NRE</text>
  <text x="642" y="313" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#9ca3af" font-weight="600">Allowed</text>
  <text x="642" y="332" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#546070">EMIs payable from NRO</text>

  <!-- Row 5: Best for -->
  <rect x="50" y="344" width="900" height="52" fill="#0b0b0b"/>
  <line x1="50" y1="344" x2="950" y2="344" stroke="#161616" stroke-width="1"/>
  <text x="62" y="365" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#9ca3af" letter-spacing="1" font-weight="600">BEST FOR</text>
  <text x="62" y="384" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#546070">Investor type</text>
  <text x="352" y="365" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#C6A667" font-weight="700">Fresh investment from abroad</text>
  <text x="352" y="384" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#8a9aaa">Priority if you plan to repatriate</text>
  <text x="642" y="365" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#9ca3af" font-weight="600">Managing existing India income</text>
  <text x="642" y="384" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#546070">Rental income, dividends etc.</text>

  <!-- Bottom bar -->
  <line x1="50" y1="400" x2="950" y2="400" stroke="#161616" stroke-width="1"/>
  <text x="500" y="425" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#374151" text-anchor="middle">LSR Realty NRI Desk recommends routing all fresh property investment through NRE for clean repatriation on exit.</text>
  <text x="500" y="445" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1f2937" text-anchor="middle">Contact: marketing@lsrrealty.com · +91 8448660019 · lsrrealty.com</text>
