<svg width="1000" height="380" viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="380" fill="#070707"/>
  <rect width="1000" height="3" fill="#C6A667"/>
  <rect x="0" y="377" width="1000" height="3" fill="#C6A667"/>

  <!-- Title -->
  <text x="50" y="50" font-family="Georgia,'Times New Roman',serif" font-size="21" fill="#f0f0f0" font-weight="700">NRI Property Tax in India: Key Rates at a Glance (2026)</text>
  <text x="50" y="72" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#546070">Know these before you sign. Tax planning before purchase and sale is non-negotiable for NRI investors.</text>

  <!-- Card 1: TDS on NRI Seller (x=50, width=280) -->
  <rect x="50" y="92" width="280" height="220" fill="#0d0d0d" rx="2" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="50" y="92" width="280" height="2.5" fill="#C6A667" opacity="0.5"/>
  <text x="62" y="122" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#9ca3af" letter-spacing="1.5" font-weight="700">TDS ON NRI SELLER</text>
  <text x="190" y="182" font-family="Georgia,serif" font-size="52" fill="#C6A667" text-anchor="middle" font-weight="700">20%</text>
  <text x="190" y="205" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="600">Long-Term Capital Gains</text>
  <line x1="70" y1="218" x2="310" y2="218" stroke="#1a1a1a" stroke-width="1"/>
  <text x="190" y="237" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#9b0000" text-anchor="middle" font-weight="600">30% for Short-Term Gains</text>
  <text x="190" y="256" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#546070" text-anchor="middle">Buyer deducts TDS from</text>
  <text x="190" y="272" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#546070" text-anchor="middle">transaction value</text>
  <text x="190" y="292" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#374151" text-anchor="middle">Property held &gt;24 months = LTCG</text>

  <!-- Card 2: Rental Income TDS (x=360, width=280) -->
  <rect x="360" y="92" width="280" height="220" fill="#0d0d0d" rx="2" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="360" y="92" width="280" height="2.5" fill="#C6A667" opacity="0.5"/>
  <text x="372" y="122" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#9ca3af" letter-spacing="1.5" font-weight="700">RENTAL INCOME TDS</text>
  <text x="500" y="182" font-family="Georgia,serif" font-size="52" fill="#C6A667" text-anchor="middle" font-weight="700">31.2%</text>
  <text x="500" y="205" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="600">Deducted by tenant</text>
  <line x1="380" y1="218" x2="620" y2="218" stroke="#1a1a1a" stroke-width="1"/>
  <text x="500" y="237" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#9ca3af" text-anchor="middle" font-weight="600">On every rental payment</text>
  <text x="500" y="256" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#546070" text-anchor="middle">NRI can claim 30% standard</text>
  <text x="500" y="272" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#546070" text-anchor="middle">deduction for maintenance</text>
  <text x="500" y="292" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#374151" text-anchor="middle">Income flows to NRO account</text>

  <!-- Card 3: LTCG on Sale (x=670, width=280) -->
  <rect x="670" y="92" width="280" height="220" fill="#0d0d0d" rx="2" stroke="#C6A667" stroke-width="1.25"/>
  <rect x="670" y="92" width="280" height="2.5" fill="#C6A667"/>
  <text x="682" y="122" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#9ca3af" letter-spacing="1.5" font-weight="700">LTCG ON PROPERTY SALE</text>
  <text x="810" y="182" font-family="Georgia,serif" font-size="52" fill="#C6A667" text-anchor="middle" font-weight="700">20%</text>
  <text x="810" y="205" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="600">On indexed gain</text>
  <line x1="690" y1="218" x2="930" y2="218" stroke="#2a2a2a" stroke-width="1"/>
  <text x="810" y="237" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#C6A667" text-anchor="middle" font-weight="600">After 24 months holding</text>
  <text x="810" y="256" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#546070" text-anchor="middle">Defer via Sec 54 (new property)</text>
  <text x="810" y="272" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#546070" text-anchor="middle">or Sec 54EC bonds (₹50L cap)</text>
  <text x="810" y="292" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#374151" text-anchor="middle">Plan reinvestment before sale</text>

  <!-- Footer: DTAA note -->
  <line x1="50" y1="326" x2="950" y2="326" stroke="#141414" stroke-width="1"/>
  <text x="500" y="350" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#374151" text-anchor="middle">DTAA treaties with the US, UK, UAE, Singapore and Canada may reduce the effective Indian tax on rental and capital gains income.</text>
  <text x="500" y="368" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#1f2937" text-anchor="middle">LSR Realty NRI Desk · marketing@lsrrealty.com · lsrrealty.com</text>
</svg>
